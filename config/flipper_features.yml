shared:
  shop: Koi shop where users can spend koi on items and experiences
  collaborators: Allow users to add collaborators to their projects
  grant_fulfillment: User-facing project-funding requests and the admin approval/HCB topup flow
  hcb_top_ups: User-funded top-ups via HCB donations onto the user's grant card
  disable_new_submissions: Block creating new projects and submitting projects that have never been shipped before (resubmissions of already-shipped projects still allowed)
  new_submissions_override: Per-user override allowing project creation and first-time submissions even while disable_new_submissions is on
  final_reviews: Program wind-down — a returned ship must be resubmitted within 3 days of being returned, and any submission made on/after the cutoff is the project's last regardless of its outcome
  final_reviews_override: Per-user override exempting a user from the final_reviews deadline and one-final-review rule
  disable_ticket_claims: Block claiming a Fallout summit ticket entirely (existing claims are unaffected)
  ticket_claims_override: Per-user override allowing a user to claim a ticket even while disable_ticket_claims is on

